# Compatibility Matrix — combinations with a documented case (or a definitional reason).
# The validator must never flag any of these as HARD_CONFLICT (audit: CONFLICT AUDIT).
# 'expect' is the validator result for the set when given at the same time:
#   VALID_COMBINATION | VALID (static states only) | SOFT_OK (a SOFT warning such as motion count is allowed, never HARD)
# evidence: source IDs + where; PRJ = no external case, valid by mechanism (research 07 D04).


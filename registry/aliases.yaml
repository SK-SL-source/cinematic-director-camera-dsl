  ONESHOT: {reason: "Ambiguous: a single-person shot (/SINGLE) or a one-take oner. Say which.", sources: []}
  SPIELBERG: {reason: "Director names are not camera commands (spec section 1-G). Write the camera parameters instead.", sources: [SRC-001, SRC-007]}
  NOLAN: {reason: "Director names are not camera commands (spec section 1-G).", sources: [SRC-007]}
  KUBRICK: {reason: "Director names are not camera commands (spec section 1-G).", sources: [SRC-004]}

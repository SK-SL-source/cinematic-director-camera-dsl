# Alias Registry — every alias resolves to exactly one canonical command (or is declared out of scope).
# relationship types
#   semantic_alias     different word, same meaning            (PUSHIN -> DOLLYIN)
#   abbreviation       short form                               (MCU is canonical; XCU -> ECU)
#   spelling_variant   spelling / punctuation variant           (CENTRED -> CENTER)
#   parameter_alias    alias that fixes an argument             (PANLEFT -> PAN:L)
#   arg_dependent      resolution depends on the argument       (DOLLY:L -> TRUCK:L, DOLLY:IN -> DOLLYIN)
#   rig_variant_alias  different rig, same picture              (JIB -> CRANE)
#   composite          expands to several canonical commands    (HANDHELDFOLLOW -> HANDHELD + FOLLOW)
#   legacy             one of the 20 original commands (spec section 15)
#   legacy_ambiguous   legacy word with several readings; resolves to the camera reading and WARNS
# 'args' are prepended to the user's own arguments. 'warning' is always shown when the alias is used.


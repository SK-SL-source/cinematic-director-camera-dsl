# Words the parser recognises but will not turn into camera commands (research 07 D28).
out_of_scope:
  TURNTABLE: {reason: "Subject rotation, not a camera move. Use /ORBIT if the camera should circle (REG-06).", sources: [SRC-002]}
  LAZYSUSAN: {reason: "Subject on a turntable = subject rotation, not a camera move (REG-06).", sources: [SRC-002]}
  SPIN: {reason: "Ambiguous subject spin. Use /ORBIT (camera circles) or /ROLL (camera rolls).", sources: []}
  BULLETTIME: {reason: "Time-freeze effect plus camera sweep; not a single camera parameter. Measured as not achievable on H3 (SRC-009 shots/bullet-time.md).", sources: [SRC-001, SRC-002, SRC-009]}
  HYPERLAPSE: {reason: "Playback speed / time manipulation is out of scope in v1.", sources: [SRC-001, SRC-002]}
  TIMELAPSE: {reason: "Playback speed is out of scope in v1.", sources: [SRC-002, SRC-005]}
  SLOWMO: {reason: "Playback speed is out of scope in v1.", sources: [SRC-005]}
  SPEEDRAMP: {reason: "Playback speed is out of scope in v1.", sources: [SRC-002, SRC-005]}
  LOWSHUTTER: {reason: "Shutter / motion-blur setting, not camera placement.", sources: [SRC-002]}
  SNORRICAM: {reason: "Body-mounted rig; single-source platform preset. Measured on H3 only as a described result, never by naming the rig (SRC-009).", sources: [SRC-002, SRC-009]}
  HEADTRACKING: {reason: "Higgsfield platform preset.", sources: [SRC-002]}
  CARGRIP: {reason: "Vehicle rig preset (single source).", sources: [SRC-002]}
  BUCKLEUP: {reason: "Higgsfield platform preset.", sources: [SRC-002]}
  MOUTHIN: {reason: "Higgsfield platform preset (surreal transition).", sources: [SRC-002]}
  LEVITATION: {reason: "Higgsfield platform preset.", sources: [SRC-002]}
  ROBOARM: {reason: "Higgsfield platform preset.", sources: [SRC-002]}
  SELFIE: {reason: "Composite of height + angle + rig + eyeline; write the parts (e.g. /HIGHANGLE /HANDHELD /EYELINE:A>CAM).", sources: [SRC-002]}
  ASPECT: {reason: "Aspect ratio is out of scope in v1 (set it in the model, not in camera text; SRC-004 cinlang:442-460).", sources: [SRC-004]}
  LETTERBOX: {reason: "Aspect ratio is out of scope; asking for bars paints them into the image (SRC-004 cinlang:458).", sources: [SRC-004]}

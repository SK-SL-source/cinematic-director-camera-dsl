# Canonical Command Registry — cinematic-director-camera-dsl
# The single home of command meaning. Everything else (references tables, adapters' markers,
# tests) is checked against this file by scripts/audit.py.
#
# Field guide (per command)
#   command / canonical_name / category   identity
#   kind          state | movement | rig | lens | focus | composition | continuity | style
#   definition    what it means, in this project's own words
#   critical_rule the one mistake that must never happen (optional)
#   params        allowed argument slots, in the order they are usually written (see meta.param_slots)
#   writes        dimensions this command sets (core values; contradicting them is a conflict)
#   defaults      dimensions it sets only when nothing explicit says otherwise (overridable, no conflict)
#   specializes   a more general canonical command this one refines (merge, not conflict)
#   sources       SOURCE IDs from research/01_sources.md ([] only for PROJECT_DEFINED)
#   confidence    HIGH | MEDIUM | LOW | PROJECT_DEFINED   (rules: research/07 D27)
#   aliases       alias tokens that resolve here (full list with relationships: aliases.yaml)
#   conflicts     representative conflicting commands (full logic: conflict_matrix.yaml)
#   compatible_with representative valid partners (evidence: compatibility_matrix.yaml)
#   image_behavior / video_behavior   what adapters must express in each mode
#   markers       regexes; an adapter's output must match at least one per language
#   anti_markers  regexes that must NOT appear when this command is the only one in its dimension

meta:
  version: "2.0.0"  # V2_BASELINE (BASELINE_V2.md); every later change is logged in CHANGELOG.md
  date: "2026-09-30"
  frame_convention: "Every L/R argument is camera-relative (= screen-relative). ORBIT:R = camera travels toward camera-right = counterclockwise seen from above."
  lens_convention: "Focal lengths are 35mm full-frame equivalent (SRC-004 cinlang:10-15)."
  speed_scale: [IMPERCEPTIBLE, VSLOW, SLOW, STEADY, BRISK, FAST]
  size_ladder: {EWS: 1, WS: 2, FS: 2, MFS: 2, COWBOY: 2, MS: 3, MCU: 4, CU: 5, ECU: 6}
  pitch_order: [VERTICAL_UP, LOW, LEVEL, HIGH, VERTICAL_DOWN]
  height_order: [GROUND, ANKLE, KNEE, HIP, CHEST, SHOULDER, EYE, ELEVATED, AERIAL]
  param_slots:
    dir_lr: "L | R"
    dir_ud: "UP | DOWN"
    dir_io: "IN | OUT"
    dir_rot: "CW | CCW"
    dir_orbit: "L | R | CW | CCW"
    dir_reveal: "UP | BACK"
    speed: "IMPERCEPTIBLE | VSLOW | SLOW | STEADY | BRISK | FAST"
    percent: "e.g. 20%"
    degrees: "e.g. 90 or 90DEG"
    distance: "e.g. 1M or 30CM"
    magnitude: "SMALL | MEDIUM | LARGE | PARTIAL | FULL"
    size_range: "START>END sizes, e.g. MS>MCU"
    relation: "A>B, FG>BG, A>CAM, A>OFFL, A>OFFR, A>OFFUP, A>OFFDOWN"
    axis: "A-B (A screen-left, B screen-right)"
    screen: "L2R | R2L | TOWARD | AWAY"
    subject: "a subject id: A, B, ANNA ..."
    label: "a free word naming an object or place: LETTER, DOOR ..."
    mm: "focal length, e.g. 35 or 35MM"
    intensity: "SUBTLE | STRONG"
    angle_intensity: "SLIGHT | STEEP"
    level: "TIGHT | NORMAL | LOOSE"
    method: "MOVE | NEUTRAL | CUTAWAY | REESTABLISH | BLOCKING"
    kind: "SHAPE | MOTION | COMPOSITION"
    side: "L | R | UP | DOWN"

commands:

  # ------------------------------------------------------------------ SHOT_SIZE
  EWS:
    command: /EWS
    canonical_name: extreme_wide_shot
    category: SHOT_SIZE
    kind: state
    definition: "The subject is very small (about an eighth of the frame height or less) inside a vast environment; the place dominates."
    params: []
    writes: {shot.size: EWS}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004]
    confidence: HIGH
    aliases: [/ELS, /EXTREMEWIDE, /EXTREMELONGSHOT, /XWS]
    conflicts: [WS, CU, ECU, MACRO, INSERT]
    compatible_with: [HIGHANGLE, DRONEVIEW, AERIAL, NEGSPACE, DOLLYOUT]
    image_behavior: "Frame the subject tiny in a vast space."
    video_behavior: "Opening or holding frame with the subject tiny in a vast space."
    markers:
      en: ["extreme wide"]
      zh: ["大远景"]

  WS:
    command: /WS
    canonical_name: wide_shot
    category: SHOT_SIZE
    kind: state
    definition: "The whole body is visible and the surroundings take a large share of the frame. A shot SIZE, never a lens."
    critical_rule: "Never resolve WS to a wide-angle lens, and never resolve WIDEANGLE to WS."
    params: []
    writes: {shot.size: WS}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004]
    confidence: HIGH
    aliases: [/WIDESHOT, /WIDE, /LS, /LONGSHOT]
    conflicts: [MS, CU, ECU, INSERT]
    compatible_with: [WIDEANGLE, TELEPHOTO, TRACKSIDE, EYELEVEL]
    image_behavior: "Frame the full figure with plenty of surroundings."
    video_behavior: "Frame the full figure with plenty of surroundings."
    markers:
      en: ["(?<!extreme )wide shot"]
      zh: ["(?<!大)远景"]
    anti_markers:
      en: ["wide-angle lens", "\\d+ ?mm"]

  FS:
    command: /FS
    canonical_name: full_shot
    category: SHOT_SIZE
    kind: state
    definition: "The subject fills the frame height from head to toe, with little room above and below."
    params: []
    writes: {shot.size: FS}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004, SRC-005]
    confidence: HIGH
    aliases: [/FULLBODY, /FULLSHOT]
    conflicts: [MS, CU]
    compatible_with: [GROUNDLEVEL, TRACKSIDE, GIMBAL, LOWANGLE]
    image_behavior: "Frame the subject from head to toe; the feet stay inside the frame."
    video_behavior: "Keep the subject from head to toe inside the frame; the feet stay in frame for the whole shot unless a movement changes the size."
    markers:
      en: ["head to toe", "(?<!medium )full shot"]
      zh: ["(?<!中)全景", "从头到脚"]

  MFS:
    command: /MFS
    canonical_name: medium_full_shot
    category: SHOT_SIZE
    kind: state
    definition: "Framed from the knees up."
    params: []
    writes: {shot.size: MFS}
    sources: [SRC-002, SRC-004]
    confidence: HIGH
    aliases: [/MEDIUMFULL, /MWS, /MEDIUMWIDE, /MLS]
    conflicts: [MS, FS]
    compatible_with: [TWOSHOT, EYELEVEL, STEADICAM]
    image_behavior: "Frame the subject from the knees up."
    video_behavior: "Frame the subject from the knees up."
    markers:
      en: ["knees up"]
      zh: ["中全景", "膝盖以上"]

  COWBOY:
    command: /COWBOY
    canonical_name: cowboy_shot
    category: SHOT_SIZE
    kind: state
    definition: "Framed from mid-thigh up."
    params: []
    writes: {shot.size: COWBOY}
    sources: [SRC-002]
    confidence: LOW
    aliases: [/COWBOYSHOT, /AMERICANSHOT]
    conflicts: [MS, FS]
    compatible_with: [LOWANGLE, TWOSHOT]
    image_behavior: "Frame the subject from mid-thigh up."
    video_behavior: "Frame the subject from mid-thigh up."
    markers:
      en: ["mid-thigh"]
      zh: ["大腿中部"]

  MS:
    command: /MS
    canonical_name: medium_shot
    category: SHOT_SIZE
    kind: state
    definition: "Framed from the waist up."
    params: []
    writes: {shot.size: MS}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004, SRC-005, LOCAL-002]
    confidence: HIGH
    aliases: [/MEDIUMSHOT, /MEDIUM, /MID]
    conflicts: [WS, CU, ECU]
    compatible_with: [LOWANGLE, DOLLYIN, OTS, EYELEVEL, LENS]
    image_behavior: "Frame the subject from the waist up."
    video_behavior: "Frame the subject from the waist up (the opening frame when a movement changes the size)."
    markers:
      en: ["medium shot", "waist up"]
      zh: ["(?<![全近])中景"]

  MCU:
    command: /MCU
    canonical_name: medium_close_up
    category: SHOT_SIZE
    kind: state
    definition: "Framed from the chest up."
    params: []
    writes: {shot.size: MCU}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004, SRC-005, LOCAL-002]
    confidence: HIGH
    aliases: [/MEDIUMCLOSEUP]
    conflicts: [WS, ECU]
    compatible_with: [OTS, SHALLOW, PORTRAITLENS, EYELINE]
    image_behavior: "Frame the subject from the chest up."
    video_behavior: "Frame the subject from the chest up."
    markers:
      en: ["medium close-up", "chest up"]
      zh: ["近景"]

  CU:
    command: /CU
    canonical_name: close_up
    category: SHOT_SIZE
    kind: state
    definition: "Head and shoulders; the face carries the frame."
    params: []
    writes: {shot.size: CU}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004, SRC-005, SRC-006, LOCAL-001]
    confidence: HIGH
    aliases: [/CLOSEUP, /CLOSE]
    conflicts: [EWS, WS, MS]
    compatible_with: [SHALLOW, PORTRAITLENS, LOWANGLE, RACKFOCUS]
    image_behavior: "Frame the face (head and shoulders)."
    video_behavior: "Frame the face (head and shoulders); the head stays inside the frame."
    markers:
      en: ["(?<!medium )(?<!extreme )close-up"]
      zh: ["(?<!大)特写"]

  ECU:
    command: /ECU
    canonical_name: extreme_close_up
    category: SHOT_SIZE
    kind: state
    definition: "A single detail fills the frame: an eye, a mouth, a hand, an object part."
    params: []
    writes: {shot.size: ECU}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004]
    confidence: HIGH
    aliases: [/EXTREMECLOSEUP, /XCU, /BCU]
    conflicts: [EWS, WS, TWOSHOT]
    compatible_with: [MACRO, INSERT, SHALLOW]
    image_behavior: "One detail fills the frame."
    video_behavior: "One detail fills the frame."
    markers:
      en: ["extreme close-up"]
      zh: ["大特写"]

  # ------------------------------------------------------------ SUBJECT_FRAMING
  SINGLE:
    command: /SINGLE
    canonical_name: single
    category: SUBJECT_FRAMING
    kind: state
    definition: "Only one person is in frame."
    params: [subject]
    writes: {shot.subject_count: "1"}
    sources: [SRC-004]
    confidence: LOW
    aliases: [/SINGLESHOT, /CLEANSINGLE]
    conflicts: [TWOSHOT, GROUPSHOT, DIRTYOTS]
    compatible_with: [CLEANOTS, MCU, CU]
    image_behavior: "Only one person in the frame."
    video_behavior: "Only one person in the frame for the whole shot."
    markers:
      en: ["only one person", "alone in (the )?frame", "single"]
      zh: ["单人"]

  TWOSHOT:
    command: /TWOSHOT
    canonical_name: two_shot
    category: SUBJECT_FRAMING
    kind: state
    definition: "Two subjects share the frame."
    params: [subject, subject]
    writes: {shot.subject_count: "2"}
    sources: [SRC-002, SRC-004]
    confidence: HIGH
    aliases: [/2SHOT]
    conflicts: [SINGLE, ECU, INSERT]
    compatible_with: [MS, MFS, AXIS, DEEPSTAGING]
    image_behavior: "Both subjects in one frame."
    video_behavior: "Both subjects stay in one frame."
    markers:
      en: ["two-shot", "both .* in (the )?frame"]
      zh: ["双人镜头"]

  THREESHOT:
    command: /THREESHOT
    canonical_name: three_shot
    category: SUBJECT_FRAMING
    kind: state
    definition: "Three subjects share the frame."
    params: []
    writes: {shot.subject_count: "3"}
    sources: [SRC-004]
    confidence: LOW
    aliases: [/3SHOT]
    conflicts: [SINGLE, TWOSHOT, ECU]
    compatible_with: [WS, MFS, DEEPSTAGING]
    image_behavior: "Three subjects in one frame."
    video_behavior: "Three subjects stay in one frame."
    markers:
      en: ["three-shot", "all three"]
      zh: ["三人镜头"]

  GROUPSHOT:
    command: /GROUPSHOT
    canonical_name: group_shot
    category: SUBJECT_FRAMING
    kind: state
    definition: "Four or more subjects share the frame."
    params: []
    writes: {shot.subject_count: GROUP}
    sources: [SRC-001, SRC-005]
    confidence: LOW
    aliases: [/GROUP, /ENSEMBLE]
    conflicts: [SINGLE, TWOSHOT, CU, ECU]
    compatible_with: [WS, HIGHANGLE, TOPDOWN]
    image_behavior: "The whole group in one frame."
    video_behavior: "The whole group stays in one frame."
    markers:
      en: ["group shot", "whole group"]
      zh: ["群像"]

  OTS:
    command: /OTS
    canonical_name: over_the_shoulder
    category: SUBJECT_FRAMING
    kind: state
    definition: "The camera stands behind A's shoulder looking at B; part of A (shoulder/back of head) is in the near foreground. /OTS:A>B."
    params: [relation]
    writes: {shot.viewpoint: OTS}
    defaults: {shot.ots_variant: DIRTY}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004]
    confidence: HIGH
    aliases: [/OVERTHESHOULDER, /OVERSHOULDER]
    conflicts: [POV, SINGLE]
    compatible_with: [MCU, MS, SRS, EYELINE, AXIS, SHALLOW]
    image_behavior: "A's shoulder and the back of A's head in the near foreground, B facing the camera beyond."
    video_behavior: "A's shoulder stays in the near foreground while B is the subject of the shot."
    markers:
      en: ["over the shoulder", "over-the-shoulder"]
      zh: ["过肩"]

  DIRTYOTS:
    command: /DIRTYOTS
    canonical_name: dirty_over_the_shoulder
    category: SUBJECT_FRAMING
    kind: state
    definition: "Over-the-shoulder with the foreground person's shoulder and head clearly in frame."
    params: [relation]
    writes: {shot.viewpoint: OTS, shot.ots_variant: DIRTY}
    specializes: OTS
    sources: [SRC-004]
    confidence: LOW
    aliases: [/DIRTYSINGLE]
    conflicts: [CLEANOTS, SINGLE, POV]
    compatible_with: [MCU, SRS]
    image_behavior: "The foreground shoulder and part of the head occupy a frame edge."
    video_behavior: "The foreground shoulder and part of the head stay at a frame edge."
    markers:
      en: ["shoulder .*foreground|foreground .*shoulder"]
      zh: ["前景.*肩"]

  CLEANOTS:
    command: /CLEANOTS
    canonical_name: clean_over_the_shoulder
    category: SUBJECT_FRAMING
    kind: state
    definition: "The camera sits at the over-the-shoulder position, but the foreground person is kept out of frame (a clean single from that side)."
    params: [relation]
    writes: {shot.viewpoint: OTS, shot.ots_variant: CLEAN}
    specializes: OTS
    sources: [SRC-004]
    confidence: LOW
    aliases: []
    conflicts: [DIRTYOTS, TWOSHOT]
    compatible_with: [SINGLE, MCU, SRS]
    image_behavior: "Seen from over the shoulder, but the foreground person is outside the frame."
    video_behavior: "The foreground person stays outside the frame for the whole shot."
    markers:
      en: ["stays out of (the )?frame", "outside the frame"]
      zh: ["前景人物不入画"]

  POV:
    command: /POV
    canonical_name: point_of_view
    category: SUBJECT_FRAMING
    kind: state
    definition: "The camera IS A's eyes; A is not visible (except hands/body parts only if the user writes them). /POV:A."
    critical_rule: "POV is not 'the subject looks at the camera' (that is /EYELINE:X>CAM) and not FPV (a drone rig)."
    params: [subject]
    writes: {shot.viewpoint: POV}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004, SRC-005B, LOCAL-001]
    confidence: HIGH
    aliases: [/FIRSTPERSON, /SUBJECTIVE]
    conflicts: [OTS, DIRTYOTS]
    compatible_with: [EYELEVEL, HANDHELD, INSERT, FPV]
    image_behavior: "Seen through A's eyes; A is not in the frame."
    video_behavior: "Seen through A's eyes for the whole shot; A never appears (no hands, shadow or reflection unless written)."
    markers:
      en: ["point of view", "through .*eyes", "first-person"]
      zh: ["主观镜头"]
    anti_markers:
      en: ["looks? (directly )?(into|at) the (lens|camera)"]

  FRONTAL:
    command: /FRONTAL
    canonical_name: frontal_view
    category: SUBJECT_FRAMING
    kind: state
    definition: "The subject faces the camera square-on."
    params: []
    writes: {subject.orientation: FRONTAL}
    sources: [SRC-004, SRC-001]
    confidence: MEDIUM
    aliases: [/FRONT, /FACING]
    conflicts: [PROFILE, REAR, THREEQUARTER, FOLLOW]
    compatible_with: [CENTER, SYMMETRY, LEAD]
    image_behavior: "The subject faces the camera square-on."
    video_behavior: "The subject faces the camera square-on."
    markers:
      en: ["faces the camera", "square-on", "facing the camera"]
      zh: ["正面"]

  THREEQUARTER:
    command: /THREEQUARTER
    canonical_name: three_quarter_view
    category: SUBJECT_FRAMING
    kind: state
    definition: "The subject is turned about 45 degrees from the camera."
    params: []
    writes: {subject.orientation: THREEQUARTER}
    sources: [SRC-001, SRC-002, SRC-004, LOCAL-002]
    confidence: HIGH
    aliases: [/3Q, /THREEQUARTERS]
    conflicts: [PROFILE, REAR, FRONTAL]
    compatible_with: [LOOKROOM, MCU, THIRDS]
    image_behavior: "The subject is turned about 45 degrees from the camera."
    video_behavior: "The subject is turned about 45 degrees from the camera."
    markers:
      en: ["three-quarter"]
      zh: ["四分之三"]

  PROFILE:
    command: /PROFILE
    canonical_name: profile_view
    category: SUBJECT_FRAMING
    kind: state
    definition: "The subject is seen from the side (about 90 degrees)."
    params: []
    writes: {subject.orientation: PROFILE}
    sources: [SRC-001, SRC-003, SRC-004]
    confidence: HIGH
    aliases: [/SIDEPROFILE, /SIDE]
    conflicts: [FRONTAL, REAR, THREEQUARTER]
    compatible_with: [TRACKSIDE, LOOKROOM, TRUCK]
    image_behavior: "The subject seen from the side."
    video_behavior: "The subject seen from the side."
    markers:
      en: ["profile", "from the side"]
      zh: ["(?<!四分之三)侧面"]

  REAR:
    command: /REAR
    canonical_name: rear_view
    category: SUBJECT_FRAMING
    kind: state
    definition: "The subject's back is to the camera."
    params: []
    writes: {subject.orientation: REAR}
    sources: [SRC-002, SRC-003, SRC-004]
    confidence: MEDIUM
    aliases: [/BACKVIEW, /FROMBEHIND]
    conflicts: [FRONTAL, PROFILE, LEAD]
    compatible_with: [FOLLOW, OTS, WS]
    image_behavior: "The subject seen from behind."
    video_behavior: "The subject seen from behind."
    markers:
      en: ["from behind", "back (is )?to the camera"]
      zh: ["背面", "背影"]

  # ---------------------------------------------------------------- CAMERA_ANGLE
  EYELEVEL:
    command: /EYELEVEL
    canonical_name: eye_level
    category: CAMERA_ANGLE
    kind: state
    definition: "The camera sits at the subject's eye height with a level lens axis: the neutral angle. Sets both height (EYE) and pitch (LEVEL)."
    params: []
    writes: {camera.pitch: LEVEL, camera.height: EYE}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004, SRC-005, SRC-006]
    confidence: HIGH
    aliases: [/EYE, /LEVEL, /NEUTRALANGLE]
    conflicts: [LOWANGLE, HIGHANGLE, TOPDOWN, GROUNDLEVEL, HIPLEVEL, AERIAL]
    compatible_with: [POV, MS, DUTCH, TRACKSIDE]
    image_behavior: "Camera at the subject's eye height, looking straight across."
    video_behavior: "Camera at the subject's eye height, looking straight across."
    markers:
      en: ["eye level", "eye height"]
      zh: ["平视"]

  LOWANGLE:
    command: /LOWANGLE
    canonical_name: low_angle
    category: CAMERA_ANGLE
    kind: state
    definition: "The camera looks UP at the subject (lens axis tilted upward). An angle, independent of camera height."
    params: [angle_intensity]
    writes: {camera.pitch: LOW}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004, SRC-005, SRC-006, SRC-007]
    confidence: HIGH
    aliases: [/LOW, /HEROANGLE, /UPSHOT]
    conflicts: [HIGHANGLE, TOPDOWN, BIRDSEYE, EYELEVEL]
    compatible_with: [GROUNDLEVEL, MS, DOLLYIN, WIDEANGLE, CRANE]
    image_behavior: "Camera below the subject looking up; the subject towers."
    video_behavior: "Camera below the subject looking up."
    markers:
      en: ["low angle", "look(s|ing)? up"]
      zh: ["仰拍"]

  HIGHANGLE:
    command: /HIGHANGLE
    canonical_name: high_angle
    category: CAMERA_ANGLE
    kind: state
    definition: "The camera looks DOWN at the subject at an oblique angle. Not straight down (that is TOPDOWN)."
    critical_rule: "HIGHANGLE is oblique; it never becomes a 90-degree top-down view."
    params: [angle_intensity]
    writes: {camera.pitch: HIGH}
    sources: [SRC-001, SRC-002, SRC-003, SRC-004, SRC-005, SRC-007]
    confidence: HIGH
    aliases: [/HIGH, /DOWNSHOT]
    conflicts: [LOWANGLE, TOPDOWN, WORMSEYE, EYELEVEL]
    compatible_with: [ELEVATED, WS, CRANE, DRONEVIEW]
    image_behavior: "Camera above the subject looking down at an angle (not straight down)."
    video_behavior: "Camera above the subject looking down at an angle (not straight down)."
    markers:
      en: ["high angle", "look(s|ing)? down (at|on) .* at an angle"]
      zh: ["俯拍"]
    anti_markers:
      en: ["straight down", "directly (above|overhead)", "top-down"]

  TOPDOWN:
    command: /TOPDOWN
    canonical_name: top_down
    category: CAMERA_ANGLE
    kind: state
    definition: "The lens axis points straight down (about 90 degrees). Height is not implied: a table flat-lay is top-down."
    params: []
    writes: {camera.pitch: VERTICAL_DOWN}
    sources: [SRC-001, SRC-002, SRC-004, SRC-005]
    confidence: HIGH
    aliases: [/OVERHEAD, /TOPSHOT, /FLATLAY, /GODSEYE]
    conflicts: [HIGHANGLE, LOWANGLE, EYELEVEL, GROUNDLEVEL]
    compatible_with: [BIRDSEYE, SYMMETRY, GROUPSHOT, ROLL]
    image_behavior: "Looking straight down at the subject."
    video_behavior: "Looking straight down at the subject."
    markers:
      en: ["straight down", "top-down"]
      zh: ["顶拍", "垂直俯拍"]

  BIRDSEYE:
    command: /BIRDSEYE
    canonical_name: birds_eye_view
    category: CAMERA_ANGLE
    kind: state
    definition: "Looking straight down from very high above, so the ground reads like a map and people look small. Top-down angle PLUS great height."
    critical_rule: "BIRDSEYE is not DRONEVIEW (oblique aerial) and not plain TOPDOWN (no height implied)."
    params: []
    writes: {camera.pitch: VERTICAL_DOWN, camera.height: AERIAL}
    specializes: TOPDOWN
    sources: [SRC-001, SRC-002, SRC-004, SRC-005]
    confidence: MEDIUM
    aliases: [/BIRDSEYEVIEW, /BIRDS]
    conflicts: [LOWANGLE, EYELEVEL, GROUNDLEVEL, HIGHANGLE]
    compatible_with: [TOPDOWN, DRONE, EWS, SYMMETRY]
    image_behavior: "From far above, straight down; the ground looks like a map."
    video_behavior: "From far above, straight down; the ground looks like a map."
    markers:
      en: ["bird's-eye", "like a map"]
      zh: ["鸟瞰"]
    anti_markers:
      en: ["drone view"]

  WORMSEYE:
    command: /WORMSEYE
    canonical_name: worms_eye_view
    category: CAMERA_ANGLE
    kind: state
    definition: "Looking (nearly) straight up at the subject; usually from the ground."
    params: []
    writes: {camera.pitch: VERTICAL_UP}
    defaults: {camera.height: GROUND}
    sources: [SRC-001, SRC-002, SRC-005]
    confidence: HIGH

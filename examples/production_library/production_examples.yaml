# Production Example Library: everyday filmmaking situations mapped to candidate Camera DSL.
# An example / retrieval layer, not a camera-language authority: registry/canonical_commands.yaml defines every command,
# and scripts/example_library.py checks every candidate with the parser and the conflict rules before it returns it.
# Field definitions: schema.yaml. Human-readable lists: narrative_30.md and technique_36.md (python scripts/example_library.py docs).
library_version: "1.0"
examples:
  - id: "EX-001"
    title_zh: "開場全景推近"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "35mm 廣角全景開場，女主立於仙山懸崖，鏡頭緩慢向前推近，最後聚焦側臉與花瓣。"
    camera_dsl: ["/WS", "/LENS:35", "/DOLLYIN:WS>CU:SLOW", "/SHALLOW"]
    camera_semantics: ["Dolly In 是攝影機實體前移，焦距不變；不是 Zoom In。"]
    non_camera:
      lighting: ["丁達爾光"]
      fx: ["雲霧", "飄落花瓣"]
      style: ["古風國漫 CG"]
    tags: ["推近", "推鏡", "開場", "全景", "dolly_in", "opening", "reveal"]
  - id: "EX-002"
    title_zh: "情緒特寫推鏡"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "85mm 長焦，女主含淚，從中景緩慢推至眼部極特寫。"
    camera_dsl: ["/MS", "/LENS:85", "/DOLLYIN:MS>ECU:SLOW", "/SHALLOW"]
    camera_semantics: ["Dolly In 是攝影機實體前移，不是 Zoom In。", "85mm 在 registry 屬於人像鏡頭的範圍（PORTRAITLENS，約 85 到 105mm）。"]
    non_camera:
      temporal: ["慢動作"]
      action: ["女主含淚", "眼尾泛紅", "睫毛輕顫"]
      fx: ["瞳孔倒影", "暖金色散景"]
    tags: ["推近", "推鏡", "特寫", "情緒", "眼部", "dolly_in", "close_up", "emotion"]
    build_notes: ["拿掉 /TELEPHOTO：驗證器回報 R03-LENS-CLASS-RANGE，85mm 不在 TELE 的範圍（110mm 以上）；保留案例寫明的焦距 /LENS:85。"]
  - id: "EX-003"
    title_zh: "施法蓄力推鏡"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "50mm 中景，男主結印，鏡頭從全身推近到手部法印特寫。"
    camera_dsl: ["/FS", "/LENS:50", "/DOLLYIN:FS>ECU:SLOW"]
    camera_semantics: ["攝影機實體前移，從全身推到手部極特寫。"]
    non_camera:
      action: ["男主抬手結印"]
      fx: ["金色法陣", "指縫溢出的金光"]
      color: ["暗藍色星空"]
    tags: ["推近", "推鏡", "施法", "手部特寫", "dolly_in", "magic", "insert"]
  - id: "EX-004"
    title_zh: "轉身拉遠揭示場景"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "女主猛然回眸，鏡頭快速後退，揭示整片桃林。"
    camera_dsl: ["/LENS:50", "/DOLLYOUT:MCU>WS:FAST"]
    camera_semantics: ["Dolly Out 是攝影機實體後退，不是 Zoom Out。"]
    non_camera:
      action: ["女主猛然轉身回眸"]
      fx: ["紅色花瓣", "桃林"]
      color: ["暖粉轉冷藍"]
    tags: ["拉遠", "拉鏡", "揭示", "回眸", "dolly_out", "reveal"]
  - id: "EX-005"
    title_zh: "飛升拉鏡"
    batch: "NARRATIVE_30"
    mapping_class: "COMPOSITE"
    natural_language_intent_zh: "男主背對鏡頭站在懸崖，鏡頭一邊後退、一邊升高，揭示雲海與仙山宮殿。"
    camera_dsl: ["/REAR", "/LENS:24", "/DOLLYOUT:SLOW", "/PEDESTAL:UP:SLOW"]
    camera_semantics: ["後退和升高同時進行，攝影機朝向不變。"]
    non_camera:
      fx: ["金色光環", "雲海", "仙山宮殿"]
    tags: ["飛升", "拉鏡", "拉遠", "升鏡", "揭示", "dolly_out", "pedestal_up", "reveal"]
    build_notes: ["拿掉 /ULTRAWIDE：驗證器回報 R03-LENS-CLASS-RANGE，24mm 不在 ULTRAWIDE 的範圍（18mm 以下）；保留 /LENS:24，registry 把它歸為廣角。"]
  - id: "EX-006"
    title_zh: "戰鬥結束拉遠"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "女主收劍而立，鏡頭緩慢後退，逐漸露出身後戰場。"
    camera_dsl: ["/MS", "/LENS:35", "/DOLLYOUT:MS>WS:SLOW"]
    camera_semantics: ["Dolly Out 是攝影機實體後退。"]
    non_camera:
      action: ["女主收劍而立"]
      fx: ["倒下的魔族大軍", "燃燒的戰場", "煙塵"]
      style: ["悲壯"]
    tags: ["拉遠", "拉鏡", "戰鬥", "揭示", "dolly_out", "reveal"]
  - id: "EX-007"
    title_zh: "環境橫搖"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "24mm 超廣角，從庭院左側紅梅石桌橫搖到右側倚窗讀書的白衣男子。"
    camera_dsl: ["/LENS:24", "/PAN:R:SLOW"]
    camera_semantics: ["Pan 是攝影機原地轉動，不是 Truck 側移。"]
    non_camera:
      fx: ["紅梅", "煮茶青煙", "漫天飛雪"]
      style: ["古風暖調"]
    tags: ["橫搖", "搖鏡", "環境", "pan", "establishing"]
    build_notes: ["拿掉 /ULTRAWIDE，理由同 EX-005；保留 /LENS:24。"]
  - id: "EX-008"
    title_zh: "對峙橫搖"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "50mm 中景，從左側持劍男主橫搖到右側持鞭女主。"
    camera_dsl: ["/MS", "/LENS:50", "/PAN:R:SLOW"]
    camera_semantics: ["Pan 是攝影機原地轉動。"]
    non_camera:
      fx: ["空氣波紋"]
      style: ["灰濛濛的天空與枯樹林"]
    tags: ["對峙", "橫搖", "搖鏡", "pan", "standoff"]
  - id: "EX-009"
    title_zh: "戰場全景橫搖"
    batch: "NARRATIVE_30"
    mapping_class: "COMPOSITE"
    natural_language_intent_zh: "24mm 超廣角低角度橫搖掃過戰場，帶輕微手持感。"
    camera_dsl: ["/WS", "/LENS:24", "/LOWANGLE", "/PAN:R", "/HANDHELD"]
    camera_semantics: ["/HANDHELD 是器材與晃動質感，不是方向。"]
    non_camera:
      fx: ["魔族士兵", "燃燒戰旗", "衝鋒異獸", "城堡火焰"]
      color: ["暖橙色調"]
    tags: ["戰場", "橫搖", "搖鏡", "手持", "pan", "handheld", "battle"]
    build_notes: ["拿掉 /ULTRAWIDE，理由同 EX-005；保留 /LENS:24。"]
  - id: "EX-010"
    title_zh: "跟隨行走移鏡"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "35mm 跟拍，女主沿古街青石板路行走，攝影機與她平行移動。"
    camera_dsl: ["/LENS:35", "/TRACKSIDE"]
    camera_semantics: ["Trackside 是攝影機在人物側面同步移動；方向沒寫時由模型決定，會有警告。"]
    non_camera:
      action: ["女主沿古街青石板路行走"]
    tags: ["跟拍", "移鏡", "行走", "側面跟拍", "trackside", "walk"]
  - id: "EX-011"
    title_zh: "奔跑追逐移鏡"
    batch: "NARRATIVE_30"
    mapping_class: "COMPOSITE"
    natural_language_intent_zh: "24mm 手持感，鏡頭在女主前方倒退，女主從後方奔跑追趕。"
    camera_dsl: ["/LENS:24", "/WIDEANGLE", "/LEAD", "/HANDHELD"]
    camera_semantics: ["Lead 是攝影機在人物前方倒退跟拍。"]
    non_camera:
      action: ["女主奔跑追趕"]
      fx: ["動態模糊"]
      color: ["冷青調"]
    tags: ["奔跑", "追逐", "倒退跟拍", "手持", "lead", "handheld", "chase"]
  - id: "EX-012"
    title_zh: "並肩而行移鏡"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "50mm，男女主並肩行走，鏡頭與兩人同速側移。"
    camera_dsl: ["/TWOSHOT", "/LENS:50", "/TRACKSIDE"]
    camera_semantics: ["攝影機在兩人側面同速移動。"]
    non_camera:
      action: ["男女主並肩行走"]
      lighting: ["月光"]
      style: ["竹林小徑"]
    tags: ["並肩", "雙人", "側面跟拍", "移鏡", "trackside", "two_shot"]
  - id: "EX-013"
    title_zh: "高空俯拍下降"
    batch: "NARRATIVE_30"
    mapping_class: "COMPOSITE"
    natural_language_intent_zh: "從高空俯視，鏡頭緩慢下降穿過雲層，逐漸露出下方法陣。"
    camera_dsl: ["/AERIAL", "/HIGHANGLE", "/PEDESTAL:DOWN:SLOW"]
    alternatives:
      - dsl: "/AERIAL /HIGHANGLE /CRANE:DOWN:SLOW"
        when_zh: "下降的路線是大型弧線"
      - dsl: "/DRONE /HIGHANGLE /PEDESTAL:DOWN:SLOW"
        when_zh: "用無人機下降"
    camera_semantics: ["Pedestal Down 是整台攝影機垂直下降，朝向不變。"]
    non_camera:
      action: ["白衣神女立於法陣中央", "弟子跪拜"]
      fx: ["雲層", "圓形法陣", "金色光芒"]
    ambiguity: ["若實際是大型弧線或無人機下降，改用 alternatives 裡的組合。"]
    tags: ["俯拍", "下降", "降鏡", "高空", "pedestal_down", "aerial"]
  - id: "EX-014"
    title_zh: "仰拍上升"
    batch: "NARRATIVE_30"
    mapping_class: "AMBIGUOUS"
    natural_language_intent_zh: "低角度仰拍，鏡頭緩慢向上「搖升」。"
    camera_dsl: []
    candidates:
      - dsl: "/LOWANGLE /TILT:UP:SLOW"
        when_zh: "只有鏡頭往上轉，攝影機不升高"
      - dsl: "/LOWANGLE /TILT:UP:SLOW /PEDESTAL:UP:SLOW"
        when_zh: "攝影機本體也一起升高"
    question_zh: "只是鏡頭往上轉，還是攝影機本體也升高？"
    camera_semantics: ["Tilt 是攝影機原地上下轉動；Pedestal 是整台攝影機升高。"]
    non_camera:
      fx: ["劍氣", "翻湧的烏雲", "閃電"]
      color: ["暗黑色調"]
    ambiguity: ["「搖升」可能只是上搖，也可能是上搖加升高。"]
    tags: ["仰拍", "上升", "搖升", "tilt_up", "pedestal_up"]
  - id: "EX-015"
    title_zh: "升起揭示"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "從水面倒影特寫開始，鏡頭垂直升高，逐漸揭示女主、荷花池、湖心亭與滿月。"
    camera_dsl: ["/CU", "/PEDESTAL:UP:SLOW"]
    camera_semantics: ["Pedestal Up 是整台攝影機垂直升高，朝向不變；不是 Tilt Up。"]
    non_camera:
      fx: ["水面倒映星空", "荷花池", "湖心亭", "滿月"]
      color: ["冷藍銀色調"]
    tags: ["升起", "升鏡", "揭示", "pedestal_up", "reveal"]
  - id: "EX-016"
    title_zh: "手部交握特寫"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "100mm 微距特寫，兩人交握的手，紅色絲帶纏在手腕。"
    camera_dsl: ["/ECU", "/LENS:100", "/MACRO", "/SHALLOW"]
    camera_semantics: ["本案例不需要運鏡。"]
    non_camera:
      action: ["兩手緩緩交握", "指尖微顫"]
      fx: ["紅色絲帶", "暖紅色光斑"]
    tags: ["特寫", "手部", "微距", "macro", "insert"]
  - id: "EX-017"
    title_zh: "眼部大特寫"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "85mm 長焦大特寫，女主閉眼後緩緩睜眼並落淚。"
    camera_dsl: ["/ECU", "/LENS:85", "/SHALLOW"]
    camera_semantics: ["沒有運鏡；85mm 在 registry 屬於人像鏡頭的範圍（PORTRAITLENS）。"]
    non_camera:
      temporal: ["慢動作"]
      action: ["閉眼後睜眼落淚"]
      fx: ["瞳孔倒映飛花", "淚珠"]
    tags: ["大特寫", "特寫", "眼部", "睜眼", "close_up", "emotion"]
    build_notes: ["拿掉 /TELEPHOTO，理由同 EX-002；保留 /LENS:85。"]
  - id: "EX-018"
    title_zh: "物品特寫環繞"
    batch: "NARRATIVE_30"
    mapping_class: "COMPOSITE"
    natural_language_intent_zh: "100mm 微距特寫，一支斷裂玉簪落在青石板上，鏡頭緩慢環繞半圈。"
    camera_dsl: ["/ECU", "/LENS:100", "/MACRO", "/ORBIT:R:180:SLOW"]
    camera_semantics: ["Orbit 是攝影機繞著物件走，物件不動。"]
    non_camera:
      fx: ["斷裂的玉簪", "暈開的血跡", "飄落的花瓣"]
      color: ["冷灰調"]
    tags: ["物品特寫", "環繞", "半圈", "orbit", "macro", "insert"]
  - id: "EX-019"
    title_zh: "施法 360° 環繞"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "以女主為中心，攝影機緩慢繞行 360°。"
    camera_dsl: ["/ORBIT:R:360:SLOW"]
    camera_semantics: ["攝影機繞人物走，不是人物自己旋轉。"]
    non_camera:
      action: ["女主閉目結印"]
      fx: ["藍色水元素漩渦"]
      color: ["藍金色調"]
    tags: ["環繞", "360", "施法", "orbit"]
  - id: "EX-020"
    title_zh: "擁抱半圈環繞"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT"
    natural_language_intent_zh: "35mm 雙人擁抱鏡頭，攝影機緩慢環繞半圈。"
    camera_dsl: ["/TWOSHOT", "/LENS:35", "/ORBIT:R:180:SLOW", "/SHALLOW"]
    camera_semantics: ["攝影機繞著兩人走，兩人不轉。"]
    non_camera:
      action: ["男主擁女主入懷", "女主埋在肩頭哭泣"]
      fx: ["花瓣飄落", "暖光光斑"]
    tags: ["擁抱", "雙人", "環繞", "半圈", "orbit", "two_shot"]
  - id: "EX-021"
    title_zh: "覺醒快速旋轉"
    batch: "NARRATIVE_30"
    mapping_class: "DIRECT_PLUS_FX"
    natural_language_intent_zh: "從女主正面開始，攝影機快速環繞半圈，同時發生覺醒變身。"
    camera_dsl: ["/FRONTAL", "/ORBIT:R:180:FAST"]
    camera_semantics: ["攝影機繞人物走；變身效果不屬於運鏡。"]
    non_camera:
      fx: ["黑髮轉銀髮", "棕瞳轉金瞳", "粉衣轉白衣", "能量衝擊波"]
    tags: ["覺醒", "變身", "環繞", "旋轉", "orbit", "transformation"]
  - id: "EX-022"
    title_zh: "時間凝滯回眸"
    batch: "NARRATIVE_30"
    mapping_class: "CAMERA_PLUS_TEMPORAL"
    natural_language_intent_zh: "時間凝滯，花瓣與雪花懸停，攝影機從女主側面緩慢環繞。"
    camera_dsl: ["/ORBIT:R:SLOW"]
    camera_semantics: ["只有攝影機在動；時間凝滯是時間效果，不是運鏡。"]
    non_camera:
      temporal: ["FREEZE_TIME"]
      action: ["女主緩緩回眸"]
      fx: ["花瓣懸停", "雪花懸停", "髮絲與衣擺定格"]
    tags: ["時間凝滯", "回眸", "環繞", "freeze", "orbit"]
  - id: "EX-023"
    title_zh: "慢動作擋劍"
    batch: "NARRATIVE_30"
    mapping_class: "NON_CAMERA"
    natural_language_intent_zh: "男主替女主擋劍，時間降到 1/4 速度。"
    camera_dsl: []
    camera_semantics: ["原始情境沒有指定運鏡，不自動補。"]
    non_camera:
      temporal: ["SLOW_MOTION_0.25X"]
      action: ["男主側身擋劍", "女主驚呼"]
      fx: ["鮮血飛濺"]
    tags: ["慢動作", "擋劍", "slow_motion"]
  - id: "EX-024"
    title_zh: "慢動作落崖"
    batch: "NARRATIVE_30"
    mapping_class: "CAMERA_STATE_PLUS_TEMPORAL"
    natural_language_intent_zh: "慢鏡頭俯拍，女主從懸崖墜落。"
    camera_dsl: ["/HIGHANGLE"]
    camera_semantics: ["俯拍是機位角度，沒有運鏡；慢動作是時間效果。"]
    non_camera:
      temporal: ["SLOW_MOTION"]
      action: ["女主墜崖", "伸手", "與男主指尖錯過"]
    tags: ["慢動作", "俯拍", "落崖", "high_angle", "slow_motion"]
  - id: "EX-025"
    title_zh: "回憶閃回・虛實疊化"
    batch: "NARRATIVE_30"
    mapping_class: "NON_CAMERA_EDITING"
    natural_language_intent_zh: "現實畫面逐漸虛化並疊入三段回憶，最後回到女主流淚特寫。"
    camera_dsl: ["/CU"]
    camera_semantics: ["/CU 只用於最後回到現實的特寫；疊化和閃回是剪輯，不是運鏡。"]
    non_camera:
      editing: ["DISSOLVE", "FLASHBACK_01", "FLASHBACK_02", "FLASHBACK_03", "RETURN_TO_PRESENT"]
      action: ["女主流淚"]
      color: ["暖黃漸冷"]
    tags: ["回憶", "閃回", "疊化", "flashback", "dissolve"]
  - id: "EX-026"
    title_zh: "夢境扭曲"
    batch: "NARRATIVE_30"
    mapping_class: "NON_CAMERA_FX"
    natural_language_intent_zh: "夢境般的畫面緩慢扭曲晃動，場景變形，遠處身影模糊消散。"
    camera_dsl: []
    alternatives:
      - dsl: "/HANDHELD"
        when_zh: "只要自然的攝影機晃動時另外加上；它不等於夢境扭曲"
    camera_semantics: ["夢境扭曲是畫面效果，不是運鏡。"]
    non_camera:
      fx: ["DREAM_DISTORTION", "WARP", "ENVIRONMENT_DEFORMATION", "SUBJECT_DISSOLVE"]
      color: ["冷白偏藍"]
    ambiguity: ["若只需自然的攝影機晃動，可另外加 /HANDHELD；不會自動加上。"]
    tags: ["夢境", "扭曲", "dream", "warp"]
  - id: "EX-027"
    title_zh: "對峙正反打"
    batch: "NARRATIVE_30"
    mapping_class: "MULTI_SHOT"
    natural_language_intent_zh: "男主冷酷側臉與女主含淚雙眼交替，最後兩人對視。"
    camera_dsl: []
    shots:
      - label: "S1"
        role_zh: "男主冷酷側臉"
        dsl: "/CU /AXIS:A-B"
      - label: "S2"
        role_zh: "女主含淚雙眼，反打"
        dsl: "/CU /SRS:A>B"
      - label: "S3"
        role_zh: "兩人對視"
        dsl: "/TWOSHOT /AXIS:A-B"
    camera_semantics: ["/SRS:A>B 標在反打的那一鏡；/AXIS:A-B 讓整場維持同一條軸線。"]

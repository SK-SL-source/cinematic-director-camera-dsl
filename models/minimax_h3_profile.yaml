reality_evidence:
  LOCAL_H3_REF2VA_PDD8_Q_416:
    mode: REF2VA
    evidence_status: MEASURED
    scope: "42 cells x 3 seeds (2026-09-30) plus the Ref2VA lab experiments; this is the measured behaviour under this generation profile, not MiniMax H3 in general (PROJECT_GOAL.md)"
    scope_short: "42-cell matrix"
    scope_short_zh: "42 格矩陣"
    evidence_compatibility:
      checked: "2026-10-01 CL-036: the prompt each cell was generated with (embedded in its clips) against the camera text the formal core writes today for the cell's DSL"
      rule: "the same camera semantics written with a different sentence split can change H3's behaviour (H3LAB_PAN_NEGATIVE_CLARIFIER_01), so a grade is current-core evidence only when the executed prompt contains today's camera text verbatim"
      CURRENT_CORE_EXACT_MATCH:
        cells: 17
        meaning: "current-core evidence: the grade was measured with the sentences the core writes today"
      PRE_REFACTOR_WORDING:
        cells: 25
        historical_grade_valid: true
        applicable_to_current_core: UNVERIFIED
        meaning: "historical evidence only: the grade stands for the wording it was measured with; nothing is re-run for the sake of the matrix, a command is re-validated with the current core when a production shot needs it"
    framing:
      text_only_shot_size:
        reliability: LOW
        strict_sizes:
          - MFS
          - COWBOY
          - MS
          - MCU
          - CU
          - ECU
        evidence: "reality matrix framing 31/126, 0/51 for the medium and close cells; H3LAB-FRAMING-ANCHOR-01, H3LAB-FRAMING-REFERENCE-01 and H3LAB-FRAMING-COMPOSITION-ANCHOR-01 all 0/3"
      environment_description_effect:
        status: VERIFIED
        note: "Detailed environmental descriptions can significantly widen framing and reduce subject scale."
        evidence: "H3LAB-FRAMING-SCENE-01: removing three environment-view sentences made the subject 2.4-3x larger in 2 of 3 seeds, still not waist-up (0/3)"
        scene_rule: "In a medium or closer shot, say what environment the subject is in; do not list environment elements the frame must show (rows of pillars, a whole far wall, a gate, a big sky, a vast courtyard)."
      strict_medium_shot:
        recommended_mode: I2VA_FIRST_FRAME
        evidence: "H3LAB-FRAMING-KEYFRAME-01: a real first frame kept the framing 3/3; the push read like a zoom (parallax 0/3)"
        note: "With a real first frame, framing, height and angle come from the frame; the text controls the move only. That evidence is I2VA (LOCAL_H3_I2VA_PDD8_Q_416, PROVISIONAL)."
    viewpoint:
      reliability: COMMAND_DEPENDENT
      note: "camera height and angle asked by text; the cells were graded with the same rule as the moves (mechanism = the asked height/angle is visible). Moved out of camera_motion in CL-032: a viewpoint is a state, not a move; the grades are unchanged."
      by_command:
        - {key: EYELEVEL, cell: H3R-AH-EYE, dsl: "/FS /EYELEVEL", start_framing: FS, grade: D, mechanism: 1/3, framing: 1/3, timing: 3/3, continuity: 0/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
        - {key: GROUNDLEVEL, cell: H3R-AH-GROUND, dsl: "/FS /GROUNDLEVEL", start_framing: FS, grade: F, mechanism: 0/3, framing: 1/3, timing: 3/3, continuity: 0/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
        - {key: GROUNDLEVEL+LOWANGLE, cell: H3R-AH-GROUND-LOW, dsl: "/FS /GROUNDLEVEL /LOWANGLE", start_framing: FS, grade: F, mechanism: 0/3, framing: 1/3, timing: 2/3, continuity: 1/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
        - {key: HIGHANGLE+SHOULDERLEVEL, cell: H3R-AH-SHOULDER-HIGH, dsl: "/FS /SHOULDERLEVEL /HIGHANGLE", start_framing: FS, grade: C, mechanism: 1/3, framing: 1/3, timing: 2/3, continuity: 0/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
        - {key: ELEVATED, cell: H3R-AH-ELEVATED, dsl: "/FS /ELEVATED", start_framing: FS, grade: C, mechanism: 2/3, framing: 1/3, timing: 2/3, continuity: 0/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
        - {key: TOPDOWN, cell: H3R-AH-TOPDOWN, dsl: "/FS /TOPDOWN", start_framing: FS, grade: F, mechanism: 0/3, framing: 1/3, timing: 3/3, continuity: 0/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
        - {key: BIRDSEYE, cell: H3R-AH-BIRDSEYE, dsl: "/WS /BIRDSEYE", start_framing: WS, grade: D, mechanism: 0/3, framing: 3/3, timing: 2/3, continuity: 1/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
    focus:
      reliability: COMMAND_DEPENDENT
      note: "focus actions asked by text (registry category FOCUS; IR focus.transition). Moved out of camera_motion in CL-033: a rack focus changes the focus plane, not the camera; the grade is unchanged."
      by_command:
        - {key: RACKFOCUS, cell: H3R-FOC-RACK, dsl: "/CU /RACKFOCUS:FG>A", start_framing: CU, grade: F, mechanism: 0/3, framing: 2/3, timing: 1/3, continuity: 1/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
    lens:
      reliability: COMMAND_DEPENDENT
      note: "lens words asked by text (registry category LENS; IR lens.lens_type). /WIDEANGLE is a wide-angle LENS, never a shot size; the cell checks whether H3 reads it as a lens and not as a wide shot. Moved out of camera_motion in CL-033; the grade is unchanged."
      by_command:
        - {key: WIDEANGLE, cell: H3R-NEG-WIDEANGLE, dsl: "/MS /WIDEANGLE", start_framing: MS, grade: F, mechanism: 0/3, framing: 0/3, timing: 2/3, continuity: 1/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
    continuity:
      reliability: COMMAND_DEPENDENT
      note: "two-person continuity cells: axis of action and eyeline (registry category CONTINUITY) on an over-the-shoulder framing. Two cells test the same commands from opposite sides, so the key has two rows and both are reported. Moved out of camera_motion in CL-033; the grades are unchanged."
      by_command:
        - {key: AXIS+EYELINE+OTS, cell: H3R-SB-S1, dsl: "/MCU /OTS:A>B /AXIS:A-B /EYELINE:B>OFFL", start_framing: MCU, grade: F, mechanism: 1/3, framing: 0/3, timing: 3/3, continuity: 1/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
        - {key: AXIS+EYELINE+OTS, cell: H3R-SB-S2, dsl: "/MCU /OTS:B>A /AXIS:A-B /EYELINE:A>OFFR", start_framing: MCU, grade: C, mechanism: 2/3, framing: 1/3, timing: 3/3, continuity: 2/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
    camera_motion:
      reliability: COMMAND_DEPENDENT
      grades: "A 3/3 seeds pass; B 2 pass 1 partial; C 2 pass 1 fail or 1 pass 2 partial; D 1 pass with a fail or 0 pass 2 partial; F otherwise"
      by_command:
        - {key: STATIC, cell: H3R-STATIC, dsl: "/MS /STATIC", start_framing: MS, grade: A, mechanism: 3/3, framing: 0/3, timing: 3/3, continuity: 2/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: CURRENT_CORE_EXACT_MATCH}
        - {key: PAN:L, cell: H3R-PAN-L, dsl: "/MS /PAN:L", start_framing: MS, grade: C, mechanism: 2/3, framing: 0/3, timing: 3/3, continuity: 3/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: PRE_REFACTOR_WORDING}
        - {key: PAN:R, cell: H3R-PAN-R, dsl: "/MS /PAN:R", start_framing: MS, grade: B, mechanism: 2/3, framing: 0/3, timing: 3/3, continuity: 3/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: PRE_REFACTOR_WORDING}
        - {key: TILT:UP, cell: H3R-TILT-UP, dsl: "/MS /TILT:UP", start_framing: MS, grade: A, mechanism: 3/3, framing: 0/3, timing: 3/3, continuity: 3/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: PRE_REFACTOR_WORDING}
        - {key: TILT:DOWN, cell: H3R-TILT-DOWN, dsl: "/MS /TILT:DOWN", start_framing: MS, grade: A, mechanism: 3/3, framing: 0/3, timing: 3/3, continuity: 3/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: PRE_REFACTOR_WORDING}
        - {key: DOLLYIN, cell: H3R-DOLLY-IN, dsl: "/MS /DOLLYIN:MS>MCU", start_framing: MS, end_size: MCU, grade: D, mechanism: 3/3, framing: 0/3, timing: 1/3, continuity: 3/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: PRE_REFACTOR_WORDING}
        - {key: DOLLYOUT, cell: H3R-DOLLY-OUT, dsl: "/MCU /DOLLYOUT:MCU>MS", start_framing: MCU, end_size: MS, grade: D, mechanism: 3/3, framing: 0/3, timing: 3/3, continuity: 3/3, profile: LOCAL_H3_REF2VA_PDD8_Q_416, prompt_compatibility: PRE_REFACTOR_WORDING}

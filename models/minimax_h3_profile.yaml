# MiniMax H3 capability profile (PROJECT_GOAL.md): generation profiles, reality evidence bound to mode + generation
# profile, and production routes. Read by scripts/adapters.py for routing; the 104 canonical commands and the camera
# semantics never depend on it. A grade is never "H3": it belongs to the generation profile it was measured under, and no
# local profile is an H3 default. A mode/profile without evidence is UNVERIFIED; grades are never borrowed across scopes.
# Grades are the corrected H3_RELIABILITY (CRANE_VALIDATOR_V2, PEDESTAL_REVALIDATION_V1) of tests/reality/minimax_h3/;
# lab evidence: research/h3_lab_findings.md, research/h3_root_cause_investigation.md. Changes go through CHANGELOG.md.
# Evidence rows sit in the table of what the cell tests, decided by the registry category of its commands (never by the
# name): viewpoint (CAMERA_ANGLE, CAMERA_HEIGHT), focus (FOCUS), lens (LENS), continuity (CONTINUITY), camera_motion
# (moves, rig, combinations, sequences). scripts/audit.py REALITY checks it.
# prompt_compatibility on every row: CURRENT_CORE_EXACT_MATCH = generated with the camera text the formal core writes today;
# PRE_REFACTOR_WORDING = generated with the wording before CL-030: historical evidence, current-core applicability UNVERIFIED.
# The evidence scope of a production route is mode + generation profile + direction + start framing + end framing + angle. A route may carry direction (L / R / UP / DOWN), start_framing (a shot size), end_framing (FREE = no stated end size, SPECIFIED = a stated one), end_size, angle (the stated arc of an ORBIT, in degrees) and measured_dsl; it is applied only to a move that matches every field it carries. Any other start / end pair is UNVERIFIED: the measured_dsl of the related routes is named, their grade is never applied.
# angle (CL-048): a route measured with a stated angle is applied only to a move that states exactly that angle; another angle, a keyword such as FULL, or no stated angle is UNVERIFIED and the measured_dsl is named as related evidence, its grade is never applied.
# The rows of the reality matrix follow the same scope rule: each row carries start_framing (and end_size when its dsl has one), is applied only to a shot of exactly that framing, and is otherwise named as related evidence with its grade, never applied (CL-044).
# definitions.foreground_motion_anchor: the near foreground object of the anchored DOLLYIN / DOLLYOUT routes; it gives occlusion and foreground motion, physical depth geometry NOT_VERIFIED (CL-045; the retired term is kept there as former_term).
